[project]
name = "bilianalyzer-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    # Pinned below the 2.x rewrite: openai 2.x/3.x are a breaking rewrite of the
    # client (chat.completions streaming shape, transport) that this codebase
    # does not target. A clean install with only a >=1.50.0 floor previously
    # pulled 3.6.0 and broke at import/runtime.
    "openai>=1.50.0,<2.0.0",
    "cryptography>=43.0.0,<51.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "sse-starlette>=2.0.0,<4.0.0",
    "snownlp>=0.12.3,<1.0.0",
    "aiofiles>=23.0.0,<26.0.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
